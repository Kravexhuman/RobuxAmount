<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>UlaMedia Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding-bottom: 70px; overflow-x: hidden; }
        
        /* Плеер сверху (как в YT) */
        .player-section { position: sticky; top: 0; width: 100%; background: #000; z-index: 1000; display: none; border-bottom: 1px solid #1a1a1a; }
        .player-section.active { display: block; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #111; }
        iframe { width: 100%; height: 100%; border: none; }
        
        .video-meta { padding: 15px; border-bottom: 1px solid #111; }
        .video-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
        .video-stats { display: flex; gap: 15px; font-size: 13px; color: #888; align-items: center; }
        
        /* Имитация кнопок подписки/лайков */
        .actions { display: flex; gap: 10px; margin-top: 15px; overflow-x: auto; padding-bottom: 5px; }
        .action-btn { background: #222; padding: 8px 15px; border-radius: 20px; font-size: 13px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .subscribe-btn { background: #fff; color: #000; font-weight: 600; padding: 8px 20px; border-radius: 20px; margin-left: auto; }

        /* Поиск и выдача */
        .search-container { padding: 15px; }
        .search-box { display: flex; gap: 10px; background: #111; padding: 5px 15px; border-radius: 25px; border: 1px solid #222; }
        input { flex: 1; background: transparent; border: none; color: #fff; padding: 8px; outline: none; font-size: 16px; }
        .search-btn { background: transparent; border: none; font-size: 18px; cursor: pointer; }

        .results { padding: 10px; display: grid; gap: 15px; }
        .thumb-card { display: flex; gap: 12px; cursor: pointer; }
        .thumb-img { width: 140px; aspect-ratio: 16/9; border-radius: 10px; object-fit: cover; background: #111; }
        .thumb-info { flex: 1; }
        .thumb-title { font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .thumb-channel { font-size: 12px; color: #888; margin-top: 4px; }

        /* Нижняя навигация */
        nav { position: fixed; bottom: 0; width: 100%; background: rgba(0,0,0,0.95); border-top: 1px solid #111; display: flex; justify-content: space-around; padding: 10px 0; z-index: 2000; }
        .nav-item { color: #888; text-decoration: none; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 22px; margin-bottom: 3px; display: block; }
    </style>
</head>
<body>

<div class="player-section" id="playerSection">
    <div class="video-container" id="videoContainer"></div>
    <div class="video-meta">
        <div class="video-title" id="currentTitle">Название видео</div>
        <div class="video-stats">
            <span>UlaMedia • 2026</span>
            <div class="subscribe-btn">Подписаться</div>
        </div>
        <div class="actions">
            <div class="action-btn">👍 1.2К</div>
            <div class="action-btn">👎</div>
            <div class="action-btn">➡️ Поделиться</div>
            <div class="action-btn">📥 Скачать</div>
        </div>
    </div>
</div>

<div id="homePage" class="search-container">
    <div class="search-box">
        <input type="text" id="query" placeholder="Поиск в UlaMedia...">
        <button class="search-btn" onclick="search()">🔍</button>
    </div>
    <div class="results" id="results">
        <p style="text-align:center; color:#444; margin-top:50px;">Начни поиск, бро</p>
    </div>
</div>

<nav>
    <div class="nav-item active" onclick="location.reload()">
        <span class="nav-icon">🏠</span>
        <span>Главная</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">➕</span>
        <span>Shorts</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">🔔</span>
        <span>Уведомления</span>
    </div>
    <div class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Вы</span>
    </div>
</nav>

<script>
    const API_KEY = 'AIzaSyAg8VMF7CsW2jx7brAfXsl1y21pO6qV7-c'; // Вставь свой ключ!

    async function search() {
        const q = document.getElementById('query').value;
        if(!q) return;
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&q=${q}&type=video&key=${API_KEY}`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            renderResults(data.items);
        } catch (e) { alert('Ошибка API'); }
    }

    function renderResults(items) {
        const results = document.getElementById('results');
        results.innerHTML = items.map(item => `
            <div class="thumb-card" onclick="openPlayer('${item.id.videoId}', '${item.snippet.title.replace(/'/g, "")}')">
                <img class="thumb-img" src="${item.snippet.thumbnails.medium.url}">
                <div class="thumb-info">
                    <div class="thumb-title">${item.snippet.title}</div>
                    <div class="thumb-channel">${item.snippet.channelTitle}</div>
                </div>
            </div>
        `).join('');
    }

    function openPlayer(id, title) {
        const section = document.getElementById('playerSection');
        const container = document.getElementById('videoContainer');
        document.getElementById('currentTitle').innerText = title;
        
        section.classList.add('active');
        container.innerHTML = `
            <iframe 
                src="https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1&rel=0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        `;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }
</script>
</body>
</html>
