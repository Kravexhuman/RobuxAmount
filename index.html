<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UlaMedia</title>
    <style>
        /* AMOLED Black база */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Верхняя панель */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            background: #000000;
            z-index: 100;
        }

        .logo {
            font-size: 22px;
            font-weight: 200; /* Минималистичный тонкий шрифт */
            letter-spacing: 1px;
        }

        .auth-btn {
            background-color: #333333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        /* Поиск */
        .search-container {
            padding: 10px 20px;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 12px;
            outline: none;
        }

        .search-btn {
            background: #333333;
            border: none;
            color: white;
            padding: 0 15px;
            border-radius: 12px;
        }

        /* Контент (Видосы) */
        .feed {
            padding: 20px;
            padding-bottom: 100px; /* Чтобы нижний бар не перекрывал */
            display: grid;
            gap: 20px;
        }

        .video-card {
            background: #000000;
            border: 1px solid #1a1a1a;
            border-radius: 15px;
            overflow: hidden;
        }

        .thumbnail {
            width: 100%;
            aspect-ratio: 16/9;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
        }

        .video-info {
            padding: 12px;
        }

        .video-title {
            font-size: 16px;
            margin-bottom: 5px;
        }

        /* Нижний бар */
        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000000;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            z-index: 100;
        }

        .nav-item {
            color: #888888;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
        }

        .nav-item.active {
            color: #ffffff;
        }

        /* Страница входа (модалка) */
        #login-page {
            display: none; /* Скрыто по дефолту */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }

        .login-box {
            width: 300px;
            text-align: center;
        }

        .login-box input {
            width: 100%;
            margin-bottom: 15px;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">UlaMedia</div>
        <button class="auth-btn" onclick="toggleLogin()">Войти</button>
    </header>

    <div class="search-container">
        <input type="text" placeholder="Поиск видео...">
        <button class="search-btn">Найти</button>
    </div>

    <main class="feed">
        <div class="video-card">
            <div class="thumbnail">Превью видео</div>
            <div class="video-info">
                <div class="video-title">Как кастомизировать всё на свете</div>
            </div>
        </div>
        <div class="video-card">
            <div class="thumbnail">Превью видео</div>
            <div class="video-info">
                <div class="video-title">Почему Prado 120 — это легенда</div>
            </div>
        </div>
    </main>

    <nav>
        <a href="#" class="nav-item active">Главная</a>
        <a href="#" class="nav-item">Библиотека</a>
        <a href="#" class="nav-item">Настройки</a>
    </nav>

    <div id="login-page">
        <div class="login-box">
            <h2 style="font-weight: 200;">Вход в UlaMedia</h2>
            <input type="text" placeholder="Логин">
            <input type="password" placeholder="Пароль">
            <button class="auth-btn" style="width: 100%;" onclick="toggleLogin()">Зайти</button>
            <p style="color: #555; margin-top: 20px; font-size: 12px;" onclick="toggleLogin()">назад</p>
        </div>
    </div>

    <script>
        function toggleLogin() {
            const login = document.getElementById('login-page');
            if (login.style.display === 'flex') {
                login.style.display = 'none';
            } else {
                login.style.display = 'flex';
            }
        }
    </script>

</body>
</html>
