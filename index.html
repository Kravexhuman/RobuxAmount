<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UlaMedia</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding-bottom: 80px; }
        header { padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #000; z-index: 100; border-bottom: 1px solid #111; }
        .logo { font-size: 24px; font-weight: 200; letter-spacing: 1px; }
        
        .page { display: none; padding: 10px; }
        .page.active { display: block; }

        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 12px; outline: none; }
        .btn-gray { background: #333; color: #fff; border: none; padding: 10px 18px; border-radius: 12px; cursor: pointer; font-size: 14px; }

        .feed { display: grid; gap: 20px; }
        .video-card { background: #000; border: 1px solid #1a1a1a; border-radius: 16px; overflow: hidden; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        .v-info { padding: 12px; font-size: 14px; line-height: 1.4; color: #ccc; }

        .lib-section { margin-bottom: 30px; }
        .lib-title { font-size: 18px; font-weight: 600; margin-bottom: 15px; color: #888; border-left: 3px solid #333; padding-left: 10px; }

        nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #111; display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
        .nav-item { color: #555; text-decoration: none; font-size: 11px; text-align: center; display: flex; flex-direction: column; gap: 4px; cursor: pointer; }
        .nav-item.active { color: #fff; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

<header>
    <div class="logo">UlaMedia</div>
    <button class="btn-gray" onclick="showPage('login')">Войти</button>
</header>

<div id="home" class="page active">
    <div class="search-box">
        <input type="text" id="query" placeholder="Поиск в UlaMedia...">
        <button class="btn-gray" onclick="search()">Найти</button>
    </div>
    <div class="feed" id="feed">
        <p style="text-align:center; color:#444;">Тут будут видосы после поиска...</p>
    </div>
</div>

<div id="library" class="page">
    <div class="lib-section">
        <div class="lib-title">История</div>
        <p style="color:#333; font-size:13px;">У вас пока нет просмотренных видео.</p>
    </div>
    <div class="lib-section">
        <div class="lib-title">Плейлисты</div>
        <div style="background:#111; padding:20px; border-radius:12px; text-align:center; color:#555;">
            Создать новый плейлист
        </div>
    </div>
</div>

<div id="login" class="page">
    <div style="text-align:center; margin-top:50px;">
        <h2 style="font-weight:200;">Вход</h2>
        <input type="text" placeholder="Логин" style="width:80%; margin-bottom:10px;"><br>
        <input type="password" placeholder="Пароль" style="width:80%; margin-bottom:20px;"><br>
        <button class="btn-gray" style="width:85%;" onclick="showPage('home')">Войти</button>
    </div>
</div>

<nav>
    <div class="nav-item active" id="nav-home" onclick="showPage('home')">
        <span class="nav-icon">🏠</span>
        <span>Главная</span>
    </div>
    <div class="nav-item" id="nav-library" onclick="showPage('library')">
        <span class="nav-icon">📚</span>
        <span>Библиотека</span>
    </div>
</nav>

<script>
    // === ВСТАВЬ СВОЙ КЛЮЧ НИЖЕ ===
    const API_KEY = 'AIzaSyAg8VMF7CsW2jx7brAfXsl1y21pO6qV7-c'; 

    function showPage(pageId) {
        // Скрываем все страницы
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        // Показываем нужную
        document.getElementById(pageId).classList.add('active');
        
        // Обновляем иконки в навигации
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        if(pageId !== 'login') {
            document.getElementById('nav-' + pageId).classList.add('active');
        }
    }

    async function search() {
        const q = document.getElementById('query').value;
        if(!q) return;
        
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${q}&type=video&key=${API_KEY}`;
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            if(data.error) {
                alert('Ошибка API: ' + data.error.message);
                return;
            }
            render(data.items);
        } catch (e) { 
            alert('Сайт тупит или ключ неверный!'); 
        }
    }

    function render(items) {
        const feed = document.getElementById('feed');
        if(!items || items.length === 0) {
            feed.innerHTML = '<p style="text-align:center;">Ничего не найдено</p>';
            return;
        }
        feed.innerHTML = items.map(item => `
            <div class="video-card">
                <iframe src="https://www.youtube.com/embed/${item.id.videoId}" allowfullscreen></iframe>
                <div class="v-info">${item.snippet.title}</div>
            </div>
        `).join('');
    }

    // Авто-поиск при загрузке
    window.onload = () => { 
        if(API_KEY !== 'ТВОЙ_КЛЮЧ_СЮДА') {
            document.getElementById('query').value = 'Toyota Prado 120'; 
            search(); 
        }
    };
</script>

</body>
</html>
