<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UlaMedia Pro</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding-bottom: 60px; overflow-x: hidden; }
        
        /* Плеер, который может расширяться */
        #playerSection { width: 100%; background: #000; position: sticky; top: 0; z-index: 1000; display: none; }
        #playerSection.active { display: block; }
        
        .v-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; }
        /* Тот самый принудительный фуллскрин */
        .v-wrap.full { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 99999; aspect-ratio: auto; }
        
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Наша кнопка поверх видео */
        .fs-btn { position: absolute; bottom: 10px; right: 10px; background: rgba(255,255,255,0.2); color: #fff; border: 1px solid #666; padding: 6px 12px; border-radius: 6px; font-size: 11px; z-index: 100000; backdrop-filter: blur(5px); }

        .info { padding: 15px; }
        .search-area { padding: 15px; display: flex; gap: 10px; }
        input { flex: 1; background: #111; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 25px; outline: none; }

        .list { padding: 10px; display: grid; gap: 15px; }
        .item { display: flex; gap: 12px; align-items: center; cursor: pointer; }
        .item img { width: 130px; border-radius: 12px; }
        
        nav { position: fixed; bottom: 0; width: 100%; background: #000; border-top: 1px solid #111; display: flex; justify-content: space-around; padding: 12px 0; }
    </style>
</head>
<body>

<div id="playerSection">
    <div class="v-wrap" id="vWrap">
        <button class="fs-btn" onclick="goFull()">РАЗВЕРНУТЬ</button>
        <div id="videoIn" style="width:100%; height:100%;"></div>
    </div>
    <div class="info">
        <div id="vTitle" style="font-weight:bold; font-size:16px;"></div>
        <div style="color:#555; font-size:12px; margin-top:5px;">UlaMedia Premium • com.ula.media</div>
    </div>
</div>

<div class="search-area">
    <input type="text" id="q" placeholder="Че ищем, бро?">
    <button onclick="doSearch()" style="background:none; border:none; font-size:20px;">🔍</button>
</div>

<div id="list" class="list"></div>

<nav>
    <span onclick="location.reload()">🏠</span>
    <span>📺</span>
    <span>⚙️</span>
</nav>

<script>
    const KEY = 'AIzaSyAg8VMF7CsW2jx7brAfXsl1y21pO6qV7-c'; 

    async function doSearch() {
        const val = document.getElementById('q').value;
        const r = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=10&q=${val}&type=video&key=${KEY}`);
        const d = await r.json();
        document.getElementById('list').innerHTML = d.items.map(i => `
            <div class="item" onclick="play('${i.id.videoId}', '${i.snippet.title.replace(/'/g, "")}')">
                <img src="${i.snippet.thumbnails.medium.url}">
                <div style="font-size:13px; font-weight:500;">${i.snippet.title}</div>
            </div>
        `).join('');
    }

    function play(id, t) {
        document.getElementById('playerSection').classList.add('active');
        document.getElementById('vTitle').innerText = t;
        document.getElementById('videoIn').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&modestbranding=1" allowfullscreen></iframe>`;
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function goFull() {
        const w = document.getElementById('vWrap');
        const b = event.target;
        if(!w.classList.contains('full')) {
            w.classList.add('full');
            b.innerText = 'СВЕРНУТЬ';
            // Пробуем еще системно развернуть (на всякий)
            if (w.requestFullscreen) w.requestFullscreen();
        } else {
            w.classList.remove('full');
            b.innerText = 'РАЗВЕРНУТЬ';
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }
</script>
</body>
</html>
